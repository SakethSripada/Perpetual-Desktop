name: Check
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p perpetual-desktop --test persistence --locked
      - run: cargo test -p am-proto -p am-db -p am-vcs --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-daemon --test roundtrip --locked
