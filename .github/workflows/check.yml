name: Check
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p perpetual-desktop --test persistence --locked
      - run: cargo test -p am-proto -p am-db -p am-vcs --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-daemon --test roundtrip --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-vcs -p am-proto --locked
      - name: Build universal macOS disk image
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --ci --target universal-apple-darwin

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
