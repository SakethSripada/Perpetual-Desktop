<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c2c"/><stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#5a6bff" stop-opacity="0.32"/><stop offset="1" stop-color="#5a6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#9fb0ff" stop-opacity="0.18"/><stop offset="1" stop-color="#9fb0ff" stop-opacity="0"/>
    </radialGradient>
    <filter color-interpolation-filters="sRGB" id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter color-interpolation-filters="sRGB" id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter color-interpolation-filters="sRGB" id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity="0.4" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#top)"/>
  <rect x="100" y="100" width="824" height="824" filter="url(#noise)" clip-path="url(#tile)" opacity="0.06" style="mix-blend-mode:overlay"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6"/>
  <g transform="translate(512 512) scale(10.4) translate(-32 -32)">
