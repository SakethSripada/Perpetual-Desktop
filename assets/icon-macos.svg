    <radialGradient id="b-lit" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#b-ink)" stroke-width="6.8"/>
  
  <circle cx="18.5649711574556" cy="45.435028842544405" r="6.3" fill="url(#b-ink)"/>
  <circle cx="45.435028842544405" cy="18.5649711574556" r="6.9" fill="url(#b-lit)"/></g>
    
  <defs>
