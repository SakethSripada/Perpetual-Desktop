<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#5b6cff"/><stop offset="0.55" stop-color="#4a3fd6"/><stop offset="1" stop-color="#2a1a78"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="57"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e8ff"/></linearGradient>
    <filter color-interpolation-filters="sRGB" id="lift" x="-30%" y="-30%" width="160%" height="160%">
